<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="AIDaddy">
  <!-- AIDaddy's face: the glowing core of the front page (src/components/hud/core.tsx), as a still picture. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b2233"/>
      <stop offset="0.6" stop-color="#07111b"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <radialGradient id="heart" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bff0ff"/>
      <stop offset="0.6" stop-color="#4fd8ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#ground)"/>
  <g fill="none" stroke="#4fd8ff">
    <circle cx="200" cy="200" r="188" stroke-width="1.5" stroke-dasharray="1.5 9.31" opacity="0.55"/>
    <circle cx="200" cy="200" r="164" stroke-width="7" stroke-dasharray="262 70 142 70 62 70 250 104.4" opacity="0.9" transform="rotate(-38 200 200)"/>
    <circle cx="200" cy="200" r="138" stroke-width="1" opacity="0.35"/>
    <circle cx="200" cy="200" r="138" stroke-width="3.5" stroke-dasharray="64 803.1" stroke-linecap="round" transform="rotate(120 200 200)"/>
    <circle cx="200" cy="200" r="114" stroke-width="9" stroke-dasharray="3 6.95" opacity="0.28"/>
    <circle cx="200" cy="200" r="90" stroke-width="2" stroke-dasharray="120 68.5" opacity="0.8" transform="rotate(64 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffb547" stroke-width="3" stroke-dasharray="46 1059.8" stroke-linecap="round" transform="rotate(205 200 200)"/>
  <circle cx="200" cy="200" r="70" fill="url(#heart)"/>
</svg>

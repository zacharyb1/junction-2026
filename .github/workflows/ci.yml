name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test hermes/preserve-cases.test.mjs
      - run: python3 -m unittest discover -s eval/bot -p 'test_*.py'
      - run: python3 -m unittest discover -s eval/gate -p 'test_*.py'
      - run: python3 -m unittest discover -s hermes -p 'test_*.py'
      - run: python3 -m unittest discover -s containers/hermes -p 'test_*.py'
      - run: python3 -m unittest discover -s containers/gate -p 'test_*.py'
      - run: python3 -m unittest discover -s containers/admin-keys -p 'test_*.py'
      - run: node --test scripts/verify.test.mjs scripts/cases.test.mjs scripts/restore-cases.test.mjs scripts/check-recorded-cases.test.mjs scripts/recorded-seed.test.mjs
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env.local
      - run: docker compose --env-file .env.local config --quiet
      - run: docker compose --env-file .env.local --profile bot config --quiet
      - run: docker build --tag kaveri-web:check .
      - run: node scripts/container-smoke.mjs docker kaveri-web:check
      - run: docker build --file containers/hermes/Dockerfile --tag kaveri-hermes:check .
      - name: Test Telegram plugins in the pinned runtime
        run: |
          docker run --rm --network none --volume "$PWD:/workspace:ro" \
            --entrypoint /opt/hermes/.venv/bin/python --workdir /opt/hermes \
            kaveri-hermes:check -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("/workspace/eval/gate", pattern="test_*.py")
          result = unittest.TextTestRunner().run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          '
      - run: node scripts/hermes-container-smoke.mjs docker kaveri-hermes:check kaveri-web:check

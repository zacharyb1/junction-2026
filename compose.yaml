# Default startup runs only web. --profile bot explicitly starts Telegram + its gate.
# --profile public adds an HTTPS reverse proxy for a server (needs KAVERI_DOMAIN).
# KAVERI_RESTART=unless-stopped brings services back after a crash or reboot. It defaults to "no",
# so a laptop that once ran the bot does not restart the shared Telegram token on its own.
services:
  web:
    build:
      context: .
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${KAVERI_HTTP_PORT:-3000}}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-}
        NEXT_PUBLIC_SAMPLE_CASE_ID: ${NEXT_PUBLIC_SAMPLE_CASE_ID:-}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    env_file:
      - .env.local
    environment:
      # The bot reaches web through the Compose network; people need a browser URL.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${KAVERI_HTTP_PORT:-3000}}
      # Use the same values for both services; commands supply --env-file .env.local.
      CASEFILE_SECRET: ${CASEFILE_SECRET:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      # Written by scripts/deploy/server-deploy.sh; shown as "commit" in /api/health.
      KAVERI_COMMIT: ${KAVERI_COMMIT:-}
      # The /chat page's backend (the hermes-web service) and its key. Server-side only.
      # The UKK_ names predate the rename to AIDaddy; the server's .env.local sets them, so they stay.
      UKK_API_URL: ${UKK_API_URL:-}
      UKK_API_KEY: ${UKK_API_KEY:-}
    ports:
      - "127.0.0.1:${KAVERI_HTTP_PORT:-3000}:3000"
    volumes:
      - case-data:/app/.data
    init: true
    restart: ${KAVERI_RESTART:-no}
    stop_grace_period: 30s

  ollama:
    image: docker.io/ollama/ollama:0.40.16
    profiles: [bot]
    volumes:
      - ollama-data:/root/.ollama
    # Internal only. Mac Docker uses CPU; no host GPU/socket/port is required.
    restart: ${KAVERI_RESTART:-no}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gate-init:
    image: docker.io/ollama/ollama:0.40.16
    profiles: [bot]
    entrypoint: [/bin/sh]
    command: [/kaveri/init.sh]
    environment:
      OLLAMA_HOST: http://ollama:11434
      KAVERI_GATE_MODEL: gemma3:1b
    volumes:
      - ./containers/gate/init.sh:/kaveri/init.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  hermes:
    profiles: [bot]
    image: kaveri-hermes
    build:
      context: .
      dockerfile: containers/hermes/Dockerfile
    env_file:
      - path: .env.bot
        required: false
    environment:
      # Default: the web service in this project. Set KAVERI_ENGINE_URL to use another Engine,
      # e.g. https://86.38.238.136.sslip.io/api/mcp, with that Engine's CASEFILE_SECRET.
      CASEFILE_URL: ${KAVERI_ENGINE_URL:-http://web:3000/api/mcp}
      CASEFILE_SECRET: ${CASEFILE_SECRET:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      KAVERI_GATE_URL: http://ollama:11434
      KAVERI_GATE_MODEL: gemma3:1b
    volumes:
      - hermes-home:/opt/data
    depends_on:
      web:
        condition: service_healthy
      gate-init:
        condition: service_completed_successfully
    init: true
    restart: ${KAVERI_RESTART:-no}
    # Allow the pinned runtime's reminder drain and cleanup budget before forced exit.
    stop_grace_period: 90s

  # The same AIDaddy for the /chat web page: Hermes' API server only, no Telegram token, memory and
  # scheduled jobs off, its own volume. Port 8642 is never published; only the web service calls it.
  hermes-web:
    profiles: [bot]
    image: kaveri-hermes
    env_file:
      # Only NVIDIA_API_KEY. Never put the Telegram token here (see containers/hermes/env.web.example).
      - path: .env.web
        required: false
    environment:
      KAVERI_RUNTIME: web
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${UKK_API_KEY:-}
      CASEFILE_URL: ${KAVERI_ENGINE_URL:-http://web:3000/api/mcp}
      CASEFILE_SECRET: ${CASEFILE_SECRET:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - hermes-web-home:/opt/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    init: true
    restart: ${KAVERI_RESTART:-no}
    stop_grace_period: 30s

  proxy:
    image: docker.io/library/caddy:2.11.8-alpine
    profiles: [public]
    # Public HTTPS for Case links and /try on a server. Caddy gets a Let's Encrypt certificate
    # for KAVERI_DOMAIN, which must point at this host with ports 80 and 443 reachable.
    # Published ports bypass ufw; the web service itself stays on loopback.
    environment:
      KAVERI_DOMAIN: ${KAVERI_DOMAIN:-}
    # Refuse to start without a hostname instead of failing on a confusing Caddyfile error.
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$$KAVERI_DOMAIN" || { echo "proxy: set KAVERI_DOMAIN to this server's public hostname" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./containers/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: ${KAVERI_RESTART:-no}

  # The watched-page trigger: once a day it asks the Engine to re-read the cited pages of recent cases.
  # Server only (profile public). Needs CRON_SECRET in .env.local, which the web service reads too.
  scheduler:
    image: docker.io/curlimages/curl:8.11.1
    profiles: [public]
    entrypoint: [/bin/sh, /kaveri/run.sh]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./containers/scheduler/run.sh:/kaveri/run.sh:ro
    depends_on:
      web:
        condition: service_healthy
    init: true
    restart: ${KAVERI_RESTART:-no}

  # One-off, Sunday 15 November (docs/DECISIONS.md, Sun 03:55): adds the operator's laptop keys in
  # containers/admin-keys/keys.pub to the server's root login, so private values can be set in .env.local.
  # Appends only and skips keys already there. Server only (profile public): Compose on a laptop never touches
  # that laptop's /root/.ssh. Remove this service once the keys are in.
  admin-keys:
    image: docker.io/curlimages/curl:8.11.1
    profiles: [public]
    user: "0:0"
    entrypoint: [/bin/sh, /kaveri/add.sh]
    volumes:
      - ./containers/admin-keys/add.sh:/kaveri/add.sh:ro
      - ./containers/admin-keys/keys.pub:/kaveri/keys.pub:ro
      - /root/.ssh:/host-ssh
    restart: "no"

volumes:
  case-data:
  hermes-home:
  hermes-web-home:
  ollama-data:
  caddy-data:
  caddy-config:

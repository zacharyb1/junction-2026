<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIDaddy</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main>
      <p class="label"><img src="icons/icon-48.png" width="24" height="24" alt="" /><span class="mark"><b>AI</b>Daddy</span> · one step ahead</p>
      <p id="state" class="state" role="status"></p>
      <button id="toggle" class="primary wide"></button>
      <button id="site" class="wide"></button>
      <button id="settings" class="wide">Settings and what it may fill in</button>
      <p class="small">AIDaddy reads only the page you are on. A page with a password or payment field is never read.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
